<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône Habit Quest : épée du jeu sur fond de forêt (cf. scripts/generate-pwa-icons.mjs) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2f24"/>
      <stop offset="0.45" stop-color="#131f18"/>
      <stop offset="1" stop-color="#0d1711"/>
    </linearGradient>
    <radialGradient id="halo-bg" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#4a76a8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4a76a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cd6f"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5ec"/>
      <stop offset="1" stop-color="#b8c4a3"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a26"/>
      <stop offset="1" stop-color="#3a2812"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112.6" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112.6" fill="url(#halo-bg)"/>
  <ellipse cx="256" cy="266" rx="164" ry="194" fill="#8fe3a0" opacity="0.1"/>
  <rect x="6.7" y="6.7" width="498.6" height="498.6" rx="106" fill="none" stroke="#4a6b3c" stroke-width="8" stroke-opacity="0.85"/>
  <!-- lame -->
  <polygon points="256,58.9 280.6,125.4 280.6,299.5 231.4,299.5 231.4,125.4" fill="url(#blade)"/>
  <rect x="249.3" y="138.2" width="13.3" height="143.4" fill="#5a684a" opacity="0.45"/>
  <!-- garde -->
  <rect x="186.9" y="298" width="138.2" height="33.8" rx="14.3" fill="url(#gold)"/>
  <circle cx="184.3" cy="314.9" r="15.4" fill="url(#gold)"/>
  <circle cx="327.7" cy="314.9" r="15.4" fill="url(#gold)"/>
  <!-- poignée -->
  <rect x="241.7" y="331.8" width="28.7" height="70.1" fill="url(#grip)"/>
  <rect x="241.7" y="347.1" width="28.7" height="7.2" fill="#000000" opacity="0.4"/>
  <rect x="241.7" y="367.6" width="28.7" height="7.2" fill="#000000" opacity="0.4"/>
  <rect x="241.7" y="388.1" width="28.7" height="7.2" fill="#000000" opacity="0.4"/>
  <!-- pommeau et gemme -->
  <circle cx="256" cy="432.6" r="31.7" fill="url(#gold)"/>
  <circle cx="256" cy="432.6" r="13.3" fill="#8fe3a0" stroke="#4faf62" stroke-width="3"/>
</svg>
